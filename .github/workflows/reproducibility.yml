name: Reproducibilidad científica

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  reproducibility:
    name: Cápsula reproducible A3.9
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias declaradas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: Ejecutar cápsula reproducible
        env:
          PYTHON_BIN: python
        run: |
          scripts/run-reproducibility-capsule.sh \
            /tmp/attentionlab-paper-capsule
